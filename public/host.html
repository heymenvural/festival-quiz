<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festival Quiz — Dev Ekran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --gece:#0B0A1F; --mor:#241548; --sahne:#7C3AED; --neon:#FFE45E; --sis:#B9B3D6;
  --s0:#FF2E63; --s1:#17B9E0; --s2:#FFB020; --s3:#2BC275;
  /* Arka plan görselinin üstündeki karartma. 0 = görsel net, 1 = tamamen koyu.
     Yazılar okunmuyorsa bu değeri yukarı çek. */
  --perde:.80;
}
*{box-sizing:border-box}
/* Yavaşça süzülen sahne ışıkları — ekran ölü durmasın */
body::before{content:''; position:fixed; inset:-25%; z-index:0; pointer-events:none;
  background:radial-gradient(38vw 38vw at 22% 28%, rgba(124,58,237,.40), transparent 62%),
             radial-gradient(32vw 32vw at 78% 72%, rgba(255,46,99,.24), transparent 62%);
  animation:suzul 26s ease-in-out infinite alternate}
@keyframes suzul{to{transform:translate3d(5%,-4%,0) scale(1.18)}}

/* Yazılar her görselin üstünde okunsun diye karartma perdesi */
body::after{content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:linear-gradient(180deg,
    rgba(11,10,31,calc(var(--perde) + .06)) 0%,
    rgba(11,10,31,calc(var(--perde) - .10)) 45%,
    rgba(11,10,31,calc(var(--perde) + .08)) 100%)}

/* Marka barı: her ekranda üstte sabit durur */
.marka{position:fixed; top:0; left:0; right:0; height:9.5vh; z-index:20; pointer-events:none;
  display:flex; align-items:center; justify-content:space-between; padding:0 2.5vw}
.marka .kutu{background:rgba(255,255,255,.95); border-radius:16px; padding:1vh 1.3vw; line-height:0;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.marka img{max-height:6vh; max-width:20vw; object-fit:contain; display:block}
body{
  margin:0; min-height:100vh; background:var(--gece); color:#fff; overflow:hidden;
  font-family:'Manrope',system-ui,sans-serif;
  /* public/arkaplan.jpg dosyası varsa arka plan olur, yoksa mor degrade kalır */
  background-image:
    radial-gradient(120vw 70vh at 50% -25%, rgba(124,58,237,.45), transparent 65%),
    radial-gradient(70vw 50vh at 10% 110%, rgba(255,46,99,.22), transparent 60%),
    url('/arkaplan.jpg');
  background-size:auto, auto, cover;
  background-position:center;
  background-repeat:no-repeat;
}
.sahne{position:fixed; inset:0; z-index:1; display:none; flex-direction:column; padding:11vh 3vw 3vh; gap:2vh}
.sahne.acik{display:flex}
.rozet{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:1.1vw; letter-spacing:.4em;
  text-transform:uppercase; color:var(--neon)}
h1{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; margin:0; line-height:1.05}

/* --- GİRİŞ --- */
#giris{align-items:center; justify-content:center; gap:20px}
#giris input{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#fff;
  padding:16px 22px; border-radius:14px; font-size:20px; font-family:inherit; text-align:center; width:280px}
#giris input:focus{outline:2px solid var(--neon)}

/* --- LOBİ --- */
#lobi{align-items:center; justify-content:center; text-align:center}
#lobi h1{font-size:6.5vw; margin:1vh 0 2vh; background:linear-gradient(180deg,#fff 30%,#C9B6FF);
  -webkit-background-clip:text; background-clip:text; color:transparent}
.katilim{display:flex; align-items:center; gap:5vw; margin-top:1vh}
.qr{background:#fff; padding:18px; border-radius:24px; line-height:0; box-shadow:0 24px 60px rgba(0,0,0,.5); position:relative}
.qr::after{content:''; position:absolute; inset:-12px; border-radius:34px; border:3px solid rgba(255,228,94,.6);
  animation:halka 2.6s ease-out infinite}
@keyframes halka{0%{transform:scale(.97); opacity:.85} 100%{transform:scale(1.09); opacity:0}}
.qr img{width:26vh; height:26vh; display:block}
.katilBilgi{text-align:left}
.katilBilgi u{display:block; text-decoration:none; color:var(--sis); font-size:1.4vw; letter-spacing:.25em;
  text-transform:uppercase; font-weight:800; margin-bottom:.8vh}
.link{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:2.6vw; color:var(--neon); word-break:break-all}
.sayi{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:11vw; line-height:.9; margin-top:2vh}
.sayi.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{40%{transform:scale(1.16); color:var(--neon)}}
.sayiAlt{color:var(--sis); font-size:1.5vw; letter-spacing:.2em; text-transform:uppercase; font-weight:800}
.buton{background:var(--neon); color:#1A0F35; border:none; padding:22px 60px; font-size:1.9vw; font-weight:800;
  font-family:'Bricolage Grotesque',sans-serif; border-radius:99px; cursor:pointer; margin-top:3vh;
  box-shadow:0 14px 40px rgba(255,228,94,.28); transition:transform .15s}
.buton:hover{transform:translateY(-3px)}
.ipucu{color:var(--sis); font-size:1vw; margin-top:1.4vh; letter-spacing:.08em}

/* --- SORU --- */
.satirUst{display:flex; align-items:center; justify-content:space-between; gap:2vw}
.sayac{width:12vh; height:12vh; border-radius:50%; display:grid; place-items:center; flex:none;
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:5vh; color:var(--gece);
  background:var(--neon); font-variant-numeric:tabular-nums; box-shadow:0 0 60px rgba(255,228,94,.35)}
.sayac.kritik{background:var(--s0); color:#fff; animation:nabiz .6s ease-in-out infinite}
@keyframes nabiz{50%{transform:scale(1.09)}}
.cevapSayaci{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:3vh; text-align:right}
.cevapSayaci small{display:block; font-family:'Manrope'; font-size:1.1vh; letter-spacing:.25em;
  color:var(--sis); text-transform:uppercase; margin-top:.4vh}
.soruMetni{animation:sikGir .5s cubic-bezier(.2,1.2,.3,1) backwards;
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:4.4vw; line-height:1.15;
  text-align:center; padding:3vh 3vw; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
  border-radius:28px; backdrop-filter:blur(12px)}
.izgara{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:1.6vh; min-height:0}
.sik{display:flex; align-items:center; gap:1.6vw; padding:0 2.4vw; border-radius:22px;
  font-size:2.6vw; font-weight:800; box-shadow:0 12px 0 rgba(0,0,0,.28); transition:opacity .4s, filter .4s}
.sik .sekil{font-size:4vw; line-height:1; opacity:.9}
.sik{animation:sikGir .45s cubic-bezier(.2,1.2,.3,1) backwards}
@keyframes sikGir{from{opacity:0; transform:translateY(26px) scale(.97)}}
.k0{background:var(--s0)} .k1{background:var(--s1)} .k2{background:var(--s2)} .k3{background:var(--s3)}
.sik.solgun{opacity:.22; filter:grayscale(.6)}
.sik.kazanan{outline:6px solid #fff; outline-offset:-6px}
.sik .tik{margin-left:auto; font-size:3vw; opacity:0; transition:opacity .3s}
.sik.kazanan .tik{opacity:1}

/* --- SONUÇ --- */
.sonucAlan{flex:1; display:grid; grid-template-columns:1.05fr 1fr; gap:3vw; min-height:0}
.ekolayzer{display:flex; align-items:stretch; gap:1.4vw; padding-bottom:1vh}
.kolon{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%}
.kolon .adet{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:2.4vw; margin-bottom:.8vh}
.bar{width:100%; border-radius:16px 16px 6px 6px; height:0; transition:height .9s cubic-bezier(.2,.9,.3,1)}
.kolon .sekil{font-size:2.2vw; margin-top:1vh; opacity:.85}
.tablo{background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.1); border-radius:26px;
  padding:2.4vh 2vw; overflow:hidden; display:flex; flex-direction:column}
.tablo h2{font-family:'Bricolage Grotesque',sans-serif; font-size:1.9vw; margin:0 0 1.6vh; color:var(--neon);
  letter-spacing:.04em}
.sira{display:flex; align-items:center; gap:1.2vw; padding:.85vh 0; font-size:1.55vw; font-weight:800;
  border-bottom:1px solid rgba(255,255,255,.07); animation:gir .4s backwards}
@keyframes gir{from{opacity:0; transform:translateX(24px)}}
.sira .no{width:2.4vw; color:var(--sis); font-family:'Bricolage Grotesque',sans-serif}
.sira .p{margin-left:auto; color:var(--s3); font-family:'Bricolage Grotesque',sans-serif}
.sira.alt1 .no{color:var(--neon)}

/* --- FİNAL --- */
#final{align-items:center; justify-content:center; text-align:center}
#final h1{font-size:6vw; color:var(--neon); margin-bottom:3vh}
.podyum{display:flex; align-items:flex-end; gap:2vw; margin-bottom:4vh}
.basamak{background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); border-radius:22px 22px 0 0;
  padding:2vh 2.2vw; min-width:15vw; display:flex; flex-direction:column; justify-content:flex-end; gap:.6vh}
.basamak .isim{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:1.7vw}
.basamak .pn{color:var(--neon); font-size:1.4vw; font-weight:800}
.basamak .m{font-size:3vw}
.basamak{animation:yuksel .7s cubic-bezier(.2,1.1,.3,1) backwards}
@keyframes yuksel{from{transform:translateY(40px) scaleY(.6); opacity:0}}
.b1{height:34vh; background:linear-gradient(180deg,rgba(255,228,94,.3),rgba(255,228,94,.05))}
.b2{height:26vh} .b3{height:21vh}
.kalanlar{display:grid; grid-template-columns:1fr 1fr; gap:.4vh 3vw; width:60vw; text-align:left}
/* --- KÖŞE QR (soru/sonuç ekranlarında geç katılanlar için) --- */
#qrMini{position:fixed; right:1.6vw; bottom:1.6vh; display:none; align-items:center; gap:.9vw;
  background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:.9vh 1.1vw;
  backdrop-filter:blur(10px); z-index:5}
#qrMini.acik{display:flex}
#qrMini .kutu{background:#fff; padding:6px; border-radius:10px; line-height:0}
#qrMini img{width:9vh; height:9vh; display:block}
#qrMini .yazi{font-size:.95vw; font-weight:800; color:var(--sis); line-height:1.5; max-width:11vw}
#qrMini .yazi b{display:block; color:var(--neon); font-size:1.05vw; word-break:break-all}
@media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<!-- MARKA BARI: logo dosyaları public/ içine konur, yoksa kendini gizler -->
<header class="marka" id="marka">
  <div class="kutu" id="kutuBelediye"><img src="/logo-belediye.png" alt="Buharkent Belediyesi"
       onerror="document.getElementById('kutuBelediye').style.display='none'"></div>
  <div class="kutu" id="kutuFestival"><img src="/logo-festival.png" alt="İncir Festivali"
       onerror="document.getElementById('kutuFestival').style.display='none'"></div>
</header>

<!-- GİRİŞ -->
<div class="sahne acik" id="giris">
  <div class="rozet">Yönetim</div>
  <h1 style="font-size:3vw">Host şifresi</h1>
  <input id="sifre" type="password" placeholder="şifre" autocomplete="off">
  <button class="buton" style="margin-top:1vh" onclick="girisYap()">Ekranı aç</button>
  <div class="ipucu" id="hata"></div>
</div>

<!-- LOBİ -->
<div class="sahne" id="lobi">
  <div class="rozet">Festival Quiz</div>
  <h1>Telefonunu çıkar, yarışa katıl</h1>
  <div class="katilim">
    <div class="qr"><img id="qr" src="/qr.svg" alt="Katılım karekodu"></div>
    <div class="katilBilgi">
      <u>Karekodu okut ya da yaz</u>
      <div class="link" id="link">—</div>
      <div class="sayi" id="sayi">0</div>
      <div class="sayiAlt">kişi bağlandı</div>
    </div>
  </div>
  <button class="buton" onclick="devam()">Yarışmayı başlat</button>
</div>

<!-- SORU -->
<div class="sahne" id="soru">
  <div class="satirUst">
    <div class="sayac" id="sayac">20</div>
    <div class="rozet" id="soruNo">SORU 1 / 10</div>
    <div class="cevapSayaci"><span id="cevapSayi">0</span><small>cevap geldi</small></div>
  </div>
  <div class="soruMetni" id="soruMetni">—</div>
  <div class="izgara" id="izgara"></div>
</div>

<!-- SONUÇ -->
<div class="sahne" id="sonuc">
  <div class="satirUst">
    <div class="rozet" id="sonucBaslik">Doğru cevap</div>
    <button class="buton" style="margin:0; padding:14px 40px; font-size:1.3vw" onclick="devam()" id="devamBtn">Sonraki soru →</button>
  </div>
  <div class="soruMetni" id="dogruMetni" style="font-size:2.8vw; padding:2vh 3vw">—</div>
  <div class="sonucAlan">
    <div class="ekolayzer" id="ekolayzer"></div>
    <div class="tablo">
      <h2>İlk 10</h2>
      <div id="ilk10" style="flex:1; overflow:hidden"></div>
    </div>
  </div>
</div>

<!-- FİNAL -->
<div class="sahne" id="final">
  <div class="rozet">Festival Quiz</div>
  <h1>Şampiyonlar</h1>
  <div class="podyum" id="podyum"></div>
  <div class="kalanlar" id="kalanlar"></div>
</div>

<!-- KÖŞE QR: yarışma sürerken geç kalanlar da katılabilsin -->
<div id="qrMini">
  <div class="kutu"><img id="qrMiniKod" src="/qr.svg" alt=""></div>
  <div class="yazi">Sonradan katıl<b id="qrMiniLink">—</b></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({ transports:['websocket','polling'] });
const $ = id => document.getElementById(id);
const SEKIL = ['▲','◆','●','■'];
let sayacId = null, yetkili = false, sonSoru = false;

function goster(h){
  ['giris','lobi','soru','sonuc','final'].forEach(s => $(s).classList.toggle('acik', s === h));
  // Yarışma sürerken küçük QR köşede dursun, geç gelen de katılabilsin
  $('qrMini').classList.toggle('acik', h === 'soru' || h === 'sonuc');
}

/* --- giriş --- */
function girisYap(){ socket.emit('hostGiris', $('sifre').value); }
$('sifre').addEventListener('keydown', e => { if(e.key === 'Enter') girisYap(); });
socket.on('hostRed', () => { localStorage.removeItem('fq_host'); $('hata').innerText = 'Şifre yanlış.'; });
socket.on('hostOnay', d => {
  yetkili = true;
  localStorage.setItem('fq_host', $('sifre').value || localStorage.getItem('fq_host'));
  $('sayi').innerText = d.oyuncu;
  if (d.durum === 'lobi' || d.durum === 'bitti') goster('lobi');
  qrCiz();
});
// Şifre bir kere girilir, bu tarayıcıda hatırlanır
socket.on('connect', () => {
  const s = localStorage.getItem('fq_host');
  if (s) socket.emit('hostGiris', s);
});

/* --- katılım linki + QR --- */
function qrCiz(){
  const kisa = location.host;
  $('link').innerText = kisa;
  $('qrMiniLink').innerText = kisa;
  // Karekod sunucudan geliyor; tazelemek için adresi bir kez yeniliyoruz
  const src = '/qr.svg?t=' + Date.now();
  $('qr').src = src;
  $('qrMiniKod').src = src;
}

function devam(){ if (yetkili) socket.emit('hostDevam'); }
document.addEventListener('keydown', e => {
  if (!yetkili) return;
  if (e.code === 'Space'){ e.preventDefault(); devam(); }
  if (e.key === 'r' || e.key === 'R'){ if (confirm('Yarışma sıfırlansın mı? Tüm puanlar silinir.')) socket.emit('hostSifirla'); }
});

socket.on('oyuncuSayisi', n => {
  const e = $('sayi');
  if (e.innerText !== String(n)){
    e.innerText = n;
    e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop');
  }
});
socket.on('cevapSayisi', d => $('cevapSayi').innerText = d.cevaplayan);

/* --- soru --- */
socket.on('soru', d => {
  $('soruNo').innerText = `SORU ${d.no} / ${d.toplam}`;
  $('soruMetni').innerText = d.metin;
  $('cevapSayi').innerText = '0';
  $('izgara').innerHTML = d.siklar.map((s,i) =>
    `<div class="sik k${i}" id="sik${i}" style="animation-delay:${.12+i*.09}s"><span class="sekil">${SEKIL[i]}</span>${s}<span class="tik">✓</span></div>`
  ).join('');
  goster('soru');
  sayacBaslat(d.sure);
});

function sayacBaslat(sn){
  clearInterval(sayacId);
  let k = sn;
  $('sayac').innerText = k;
  $('sayac').classList.remove('kritik');
  sayacId = setInterval(() => {
    k--;
    $('sayac').innerText = Math.max(0,k);
    if (k <= 5) $('sayac').classList.add('kritik');
    if (k <= 0) clearInterval(sayacId);
  }, 1000);
}

/* --- soru bitti: dağılım + ilk 10 --- */
socket.on('soruBitti', d => {
  clearInterval(sayacId);
  sonSoru = d.sonSoru;
  $('devamBtn').innerText = sonSoru ? 'Şampiyonları göster 🏆' : 'Sonraki soru →';
  $('dogruMetni').innerText = `${SEKIL[d.dogruSik]}  ${d.dogruMetin}`;

  const enYuksek = Math.max(1, ...d.dagilim);
  $('ekolayzer').innerHTML = d.dagilim.map((adet,i) => `
    <div class="kolon">
      <div class="adet">${adet}</div>
      <div class="bar k${i}" id="bar${i}" style="${i===d.dogruSik?'':'opacity:.32'}"></div>
      <div class="sekil">${SEKIL[i]}${i===d.dogruSik?' ✓':''}</div>
      <div style="font-size:1.05vw; color:var(--sis); font-weight:800; margin-top:.5vh; text-align:center">${d.siklar[i]}</div>
    </div>`).join('');
  requestAnimationFrame(() => d.dagilim.forEach((adet,i) => {
    const b = $('bar'+i); if (b) b.style.height = Math.round(12 + (adet/enYuksek)*70) + '%';
  }));

  $('ilk10').innerHTML = d.ilk10.length
    ? d.ilk10.map((p,i) => `<div class="sira ${i===0?'alt1':''}" style="animation-delay:${i*.06}s">
        <span class="no">${i+1}</span><span>${p.ad}</span><span class="p">${p.puan}</span></div>`).join('')
    : '<div class="sira">Henüz puan alan yok</div>';

  $('sonucBaslik').innerText = `${d.cevaplayan} / ${d.toplamOyuncu} kişi cevapladı`;
  goster('sonuc');
});

/* --- final --- */
socket.on('oyunBitti', liste => {
  const ilk3 = liste.slice(0,3);
  const madalya = ['🥇','🥈','🥉'];
  const sira = [1,0,2];   // 2. - 1. - 3. dizilimi
  $('podyum').innerHTML = sira.filter(i => ilk3[i]).map(i => `
    <div class="basamak b${i+1}" style="animation-delay:${(2-i)*.18}s">
      <div class="m">${madalya[i]}</div>
      <div class="isim">${ilk3[i].ad}</div>
      <div class="pn">${ilk3[i].puan} puan</div>
    </div>`).join('');
  $('kalanlar').innerHTML = liste.slice(3).map((p,i) =>
    `<div class="sira"><span class="no">${i+4}</span><span>${p.ad}</span><span class="p">${p.puan}</span></div>`).join('');
  goster('final');
});

socket.on('sifirla', () => { clearInterval(sayacId); goster('lobi'); qrCiz(); });
</script>
</body>
</html>
